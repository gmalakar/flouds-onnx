[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flouds-onnx"
version = "2.0.0"
description = "Ollama-style ONNX model store and runtime - pull, cache, and serve ORT sessions"
readme = { file = "README.md", content-type = "text/markdown" }
keywords = ["onnx", "onnxruntime", "model-serving", "huggingface", "inference", "flouds", "flouds-onnx"]
requires-python = ">=3.11,<3.13"
authors = [{ name = "Goutam Malakar" }]
license = "Apache-2.0"
license-files = ["LICENSE"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3 :: Only",
]

# This file is the only list of dependencies; there are no requirements-*.txt files.
#
# Core deps: only what is needed to LOAD pre-exported ONNX models.
# sentence-transformers intentionally excluded — always pass library="transformers"
# explicitly when exporting, to bypass SentenceTransformer auto-detection.
# flouds-model-exporter intentionally excluded (export is opt-in, via the extra).
dependencies = [
    "onnxruntime>=1.20.1",
    "transformers>=4.44.0,<4.58.0",
    "pydantic>=2.0",
    "numpy>=1.26.4,<1.27",
]

[project.optional-dependencies]
# 2.0.0 is the first release that never enables trust_remote_code by itself and does
# not save the Hugging Face token; flouds-onnx relies on both.
export = ["flouds-model-exporter>=2.0.1,<3"]
seq2seq = ["optimum[onnxruntime]>=1.22.0"]
server = ["fastapi>=0.110.0,<1.0", "uvicorn[standard]>=0.29.0,<1.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "pre-commit==4.7.0",
    "black==24.1.1",
    "isort==5.13.2",
    "flake8==7.0.0",
    "flake8-bugbear",
    "flake8-comprehensions",
    "mypy==1.8.0",
    "pyright==1.1.410",
    "bandit==1.7.5",
    "pbr",
]
all = ["flouds-onnx[export,seq2seq,server]"]

[project.urls]
Homepage = "https://github.com/gmalakar/flouds-onnx"
Repository = "https://github.com/gmalakar/flouds-onnx"
Changelog = "https://github.com/gmalakar/flouds-onnx/blob/main/CHANGELOG.md"
Issues = "https://github.com/gmalakar/flouds-onnx/issues"

[project.scripts]
flouds-onnx = "flouds_onnx.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["flouds_onnx*"]
exclude = ["tests*", "tools*"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
markers = [
    "unit: fast, no disk or network",
    "integration: requires real HF model download",
]
filterwarnings = [
    # Suppress all third-party deprecation / user / future warnings
    # that are not actionable from flouds-onnx itself.
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    # Suppress torch TracerWarning (subclass of UserWarning) from transformers/torch
    "ignore:Converting a tensor to a Python boolean might cause the trace to be incorrect.*",
    "ignore:.*registered as constants.*",
    "ignore:.*torch.tensor results.*",
    "ignore::UserWarning:torch",
    "ignore::UserWarning:transformers",
    "ignore::UserWarning:optimum",
]

[tool.black]
line-length = 150
target-version = ["py311", "py312"]

[tool.isort]
profile = "black"
line_length = 150

[tool.mypy]
python_version = "3.11"
exclude = "(tests/|examples/|tools/|scripts/|setup_dev)"
ignore_missing_imports = true
follow_imports = "skip"
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_incomplete_defs = true

[tool.pyright]
include = ["src/flouds_onnx"]
exclude = [
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
    "src/flouds_onnx.egg-info",
]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
reportDuplicateImport = true
