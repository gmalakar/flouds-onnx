name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for reruns/manual release)."
        required: true
        type: string
      publish_to_pypi:
        description: "Publish package to PyPI on manual runs using Trusted Publishing. Tag pushes publish automatically."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-version:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.tag != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify tag matches pyproject version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' is not semver in vX.Y.Z format"
            exit 1
          fi

          PY_VERSION=$(python - <<'PY'
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )

          INIT_VERSION=$(python - <<'PY'
          import pathlib
          import re

          text = pathlib.Path("src/flouds_onnx/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          print(match.group(1) if match else "")
          PY
          )

          EXPECTED="v${PY_VERSION}"
          if [[ "$TAG" != "$EXPECTED" ]]; then
            echo "Tag '$TAG' does not match pyproject version '$EXPECTED'"
            exit 1
          fi

          if [[ "$PY_VERSION" != "$INIT_VERSION" ]]; then
            echo "pyproject version '$PY_VERSION' does not match __version__ '$INIT_VERSION'"
            exit 1
          fi

          echo "Tag, pyproject version, and package __version__ match: $TAG"

  test:
    # A tag must not publish code whose tests fail.
    runs-on: ubuntu-latest
    needs: verify-release-version
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"

      - name: Lint, type check and unit tests
        run: |
          flake8 src/ tests/
          mypy src/flouds_onnx
          bandit -r src -ll
          pytest tests/unit/ -q --cov=flouds_onnx --cov-fail-under=85

  build:
    runs-on: ubuntu-latest
    needs: [verify-release-version, test]
    if: always() && needs.verify-release-version.result == 'success' && needs.test.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate package metadata
        run: twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v6
        with:
          name: python-dist
          path: dist/*

  github-release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_pypi != 'true')
    permissions:
      contents: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v7
        with:
          name: python-dist
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_pypi == 'true')
    environment: "flouds_by_goutam"
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v7
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
